version: "3.9"

# ── CreatorAE Docker Compose ──────────────────────────────────────────────────
# Runs FastAPI and Streamlit as separate services sharing the same ChromaDB
# persistence volume and environment variables.

services:

  api:
    build: .
    container_name: creator_ae_api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - ./docs:/app/docs:ro
    restart: unless-stopped

  ui:
    build: .
    container_name: creator_ae_ui
    command: streamlit run app/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - ./docs:/app/docs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
